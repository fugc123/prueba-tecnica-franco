services:
  db:
    image: postgres:16-alpine
    container_name: prueba_tecnica_franco_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prueba_tecnica_franco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prueba_tecnica_franco"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: prueba_tecnica_franco_api
    environment:
      APP_NAME: prueba tecnica franco
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/prueba_tecnica_franco
      JWT_SECRET_KEY: 9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a
      SEED_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
